name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --ship scopes the gate to the article: a half-translated or mis-shaped
      # article is withheld from the manifest and annotated on the run, rather
      # than blocking the deploy of every other article. Only a repo-wide
      # problem — a broken UI string file, which no per-article skip can
      # contain — stops the publish here.
      - name: Validate content
        run: node scripts/validate.mjs --ship

      # The manifest is derived from content/articles/, so it is generated here
      # rather than committed. Adding an article is adding a file; nothing can
      # fall out of sync, because nothing is kept in sync by hand. It contains
      # only the articles that passed above.
      - name: Build manifest
        run: node scripts/build-manifest.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
